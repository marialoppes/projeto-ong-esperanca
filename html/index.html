<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ONG Esperança: ações sociais, projetos comunitários e oportunidades de voluntariado para apoiar pessoas em situação de vulnerabilidade.">
  <link rel="stylesheet" href="../css/style.css">
  <title>ONG Esperança - Início</title>
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo principal</a>
  <header>
    <h1>ONG Esperança</h1>
    <div class="controles-aparencia" role="group" aria-label="Opções de aparência">
      <button
        type="button"
        data-aparencia="padrao"
        aria-label="Ativar aparência padrão"
        aria-pressed="true"
        title="Aparência padrão"
        data-tooltip="Aparência padrão">
        ☀
      </button>

      <button
        type="button"
        data-aparencia="escuro"
        aria-label="Ativar modo escuro"
        aria-pressed="false"
        title="Modo escuro"
        data-tooltip="Modo escuro">
        ☾
      </button>

      <button
        type="button"
        data-aparencia="alto-contraste"
        aria-label="Ativar alto contraste"
        aria-pressed="false"
        title="Alto contraste"
        data-tooltip="Alto contraste">
        ◐
      </button>
    </div>
      <nav aria-label="Navegação principal">
        <button class="menu-toggle" type="button" aria-label="Abrir menu">
        ☰
        </button>

        <ul class="menu-principal">
          <li>
            <a href="#inicio" data-link>Início</a>
          </li>

          <li class="item-dropdown">
            <a href="#projetos" data-link>Projetos</a>

            <ul class="submenu">
              <li>
                  <a href="#projetos-campanhas-doacao" data-link>Doações</a>
              </li>

              <li>
                  <a href="#projetos-voluntariado" data-link>Voluntariado</a>
              </li>

              <li>
                  <a href="#projetos-como-participar" data-link>Como participar</a>
              </li>
            </ul>
          </li>

          <li>
            <a href="#cadastro" data-link>Cadastre-se</a>
          </li>
        </ul>
      </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer><p>&copy; 2026 ONG Esperança. Todos os direitos reservados.</p></footer>
  <script type="module" src="../js/router.js"></script>
  <script src="../js/aparencia.js"></script>
</body>
</html>
